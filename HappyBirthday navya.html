<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday Navya</title>
<style>
  /* ============ RESET & BASE ============ */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    height:100%;
    overflow:hidden;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background:linear-gradient(135deg,#3a0f4a,#7b2d6b,#b8437a,#d95d8f);
    background-size:400% 400%;
    animation:gradientShift 14s ease infinite;
    color:#fff;
  }
  @keyframes gradientShift {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  #app { position:relative; width:100%; height:100%; overflow:hidden; }

  /* ============ FLOATING HEARTS (global, behind content) ============ */
  #heartsLayer { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .floatHeart {
    position:absolute;
    bottom:-40px;
    font-size:20px;
    opacity:0.85;
    animation-name:floatUp;
    animation-timing-function:linear;
    filter:drop-shadow(0 0 6px rgba(255,120,180,0.8));
  }
  @keyframes floatUp {
    0% { transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10% { opacity:0.9; }
    100% { transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(360deg); opacity:0; }
  }

  /* ============ MUSIC TOGGLE ============ */
  #musicToggle {
    position:fixed; top:14px; right:14px; z-index:50;
    width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; cursor:pointer;
    box-shadow:0 0 14px rgba(255,150,200,0.5);
    animation:pulseGlow 2.5s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%,100% { box-shadow:0 0 10px rgba(255,150,200,0.4); }
    50% { box-shadow:0 0 22px rgba(255,150,200,0.9); }
  }

  /* ============ PAGES ============ */
  .page {
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:70px 18px 30px;
    overflow-y:auto;
    z-index:5;
    opacity:0;
  }
  .page.active {
    display:flex;
    animation:pageIn 0.7s ease forwards;
  }
  @keyframes pageIn {
    0% { opacity:0; transform:translateX(40px) scale(0.98); }
    100% { opacity:1; transform:translateX(0) scale(1); }
  }
  .page.leaving {
    animation:pageOut 0.5s ease forwards;
  }
  @keyframes pageOut {
    0% { opacity:1; transform:translateX(0) scale(1); }
    100% { opacity:0; transform:translateX(-40px) scale(0.98); }
  }

  /* ============ GLASS CARD ============ */
  .glass {
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:24px;
    box-shadow:0 8px 32px rgba(80,0,60,0.35);
    padding:26px 20px;
    width:100%;
    max-width:440px;
  }

  /* ============ BUTTONS ============ */
  .btn {
    display:inline-block;
    padding:14px 30px;
    border-radius:50px;
    border:none;
    font-size:16px;
    font-weight:600;
    color:#fff;
    background:linear-gradient(135deg,#ff5da2,#a259e6);
    box-shadow:0 6px 20px rgba(200,50,140,0.5);
    cursor:pointer;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active { transform:scale(0.94); box-shadow:0 3px 10px rgba(200,50,140,0.5); }
  .btn:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(200,50,140,0.65); }
  .btn-black {
    background:#1a1a1a;
    box-shadow:0 6px 18px rgba(0,0,0,0.5);
  }
  .navRow {
    display:flex;
    justify-content:space-between;
    width:100%;
    max-width:440px;
    margin-top:24px;
    gap:12px;
  }
  .navRow .btn { flex:1; text-align:center; font-size:15px; padding:13px 10px; }

  /* ============ PAGE 1: INTRO ============ */
  #titleWrap {
    display:flex; flex-wrap:nowrap; justify-content:center;
    gap:1px; margin-top:18px; width:100%; padding:0 4px;
  }
  #titleWrap span {
    display:inline-block;
    font-size:clamp(10px, 4.6vw, 28px);
    font-weight:800;
    opacity:0;
    transform:translateY(-90px) rotate(-25deg) scale(0.4);
    animation:letterFly 0.7s cubic-bezier(.2,.9,.3,1.3) forwards;
    text-shadow:0 0 8px #ff9ad6, 0 0 18px #ff5da2;
  }
  @keyframes letterFly {
    0% { opacity:0; transform:translateY(-90px) rotate(-25deg) scale(0.4); }
    70% { opacity:1; transform:translateY(6px) rotate(4deg) scale(1.08); }
    100% { opacity:1; transform:translateY(0) rotate(0deg) scale(1); text-shadow:0 0 6px #ff9ad6, 0 0 14px #ff5da2; }
  }
  .glowPulse {
    animation:glowPulse 1.8s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100% { text-shadow:0 0 6px #ff9ad6, 0 0 14px #ff5da2; }
    50% { text-shadow:0 0 16px #fff, 0 0 30px #ff5da2, 0 0 40px #a259e6; }
  }

  #dearText {
    margin-top:14px;
    font-size:20px;
    font-weight:600;
    opacity:0;
    animation:fadeInUp 1s ease forwards;
    animation-delay:1.6s;
    text-align:center;
  }
  @keyframes fadeInUp {
    0% { opacity:0; transform:translateY(20px); }
    100% { opacity:1; transform:translateY(0); }
  }

  #giftStage {
    margin-top:26px;
    display:flex; flex-direction:column; align-items:center;
    opacity:0;
    animation:fadeInUp 1s ease forwards;
    animation-delay:2.2s;
    width:100%;
  }

  #giftBox {
    font-size:80px;
    cursor:pointer;
    animation:giftBounce 1.4s ease-in-out infinite;
    filter:drop-shadow(0 0 16px rgba(255,150,200,0.7));
    user-select:none;
  }
  @keyframes giftBounce {
    0%,100% { transform:translateY(0) scale(1); }
    50% { transform:translateY(-14px) scale(1.05); }
  }
  #giftBox.opened {
    animation:giftPop 0.5s ease forwards;
  }
  @keyframes giftPop {
    0% { transform:scale(1); }
    40% { transform:scale(1.3) rotate(-8deg); }
    100% { transform:scale(0) rotate(10deg); opacity:0; }
  }
  #giftHint {
    margin-top:10px;
    font-size:13px;
    opacity:0.85;
    animation:fadeInUp 1s ease forwards;
    animation-delay:2.6s;
    opacity:0;
  }

  #cakeStage {
    display:none;
    flex-direction:column;
    align-items:center;
    margin-top:6px;
  }
  #countdownNum {
    font-size:52px;
    font-weight:800;
    margin-bottom:6px;
    text-shadow:0 0 20px #fff, 0 0 30px #ff5da2;
    animation:countPop 1s ease;
  }
  @keyframes countPop {
    0% { transform:scale(0.3); opacity:0; }
    30% { transform:scale(1.3); opacity:1; }
    100% { transform:scale(1); opacity:1; }
  }
  #cakeWrap {
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    opacity:0;
    transform:scale(0.5);
    animation:cakePop 0.7s cubic-bezier(.2,.9,.3,1.4) forwards;
  }
  @keyframes cakePop {
    0% { opacity:0; transform:scale(0.3) translateY(40px); }
    70% { opacity:1; transform:scale(1.12) translateY(-6px); }
    100% { opacity:1; transform:scale(1) translateY(0); }
  }
  #candles {
    display:flex; gap:10px; margin-bottom:-6px; z-index:2;
  }
  .candle { position:relative; font-size:26px; }
  .flameEmoji {
    display:inline-block;
    animation:flicker 0.4s ease-in-out infinite alternate;
    transform-origin:bottom center;
  }
  @keyframes flicker {
    0% { transform:scale(1) rotate(-3deg); }
    100% { transform:scale(1.08) rotate(3deg); }
  }
  .flameEmoji.blown {
    animation:none;
    filter:grayscale(1) brightness(0.55);
    opacity:0.6;
    transition:filter 0.4s ease, opacity 0.4s ease;
  }
  .smoke {
    position:absolute; top:-10px; left:50%;
    font-size:12px; opacity:0;
    transform:translateX(-50%);
  }
  .smoke.active {
    animation:smokeRise 1.6s ease-out forwards;
  }
  @keyframes smokeRise {
    0% { opacity:0.8; transform:translateX(-50%) translateY(0) scale(1); }
    100% { opacity:0; transform:translateX(-50%) translateY(-40px) scale(1.8); }
  }
  #cakeEmoji { font-size:90px; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.3)); }

  #wishText {
    margin-top:18px;
    font-size:24px;
    font-weight:800;
    opacity:0;
    text-shadow:0 0 14px #fff, 0 0 24px #ff5da2;
  }
  #wishText.show { animation:fadeInUp 0.8s ease forwards; }

  #nextSurpriseBtn { margin-top:26px; display:none; }

  /* ============ CONFETTI / FIREWORKS ============ */
  #fxLayer { position:fixed; inset:0; pointer-events:none; z-index:40; overflow:hidden; }
  .confetti {
    position:absolute; top:-20px; width:8px; height:14px; opacity:0.95;
    animation-name:confettiFall; animation-timing-function:linear;
  }
  @keyframes confettiFall {
    0% { transform:translateY(0) rotate(0deg); opacity:1; }
    100% { transform:translateY(110vh) rotate(600deg); opacity:0.3; }
  }
  .fwParticle {
    position:absolute; width:6px; height:6px; border-radius:50%;
    animation-name:fwBurst; animation-timing-function:cubic-bezier(.2,.7,.3,1);
  }
  @keyframes fwBurst {
    0% { transform:translate(0,0) scale(1); opacity:1; }
    100% { transform:translate(var(--tx), var(--ty)) scale(0.2); opacity:0; }
  }

  /* ============ PAGE 2: MESSAGE ============ */
  #page2 .glass { margin-top:30px; }
  #msgHeading {
    text-align:center; font-size:22px; font-weight:800;
    margin-bottom:16px;
    text-shadow:0 0 10px #ff9ad6;
  }
  #typedMsg {
    font-size:16px; line-height:1.7; min-height:180px;
    white-space:pre-wrap;
  }
  #typedMsg .cursor {
    display:inline-block; width:2px; background:#fff;
    animation:blink 0.8s step-end infinite;
    margin-left:2px;
  }
  @keyframes blink { 50% { opacity:0; } }

  /* ============ PAGE 3: GALLERY ============ */
  #galleryGrid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:100%;
    max-width:440px;
    margin-top:16px;
  }
  .photoCard {
    border-radius:18px;
    overflow:hidden;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.3);
    box-shadow:0 6px 18px rgba(80,0,60,0.3);
    aspect-ratio:1/1;
    opacity:0;
    animation:fadeInUp 0.7s ease forwards;
    cursor:pointer;
    transition:transform 0.2s ease;
  }
  .photoCard:active { transform:scale(0.95); }
  .photoCard img { width:100%; height:100%; object-fit:cover; display:block; }

  #photoModal {
    position:fixed; inset:0; z-index:60;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(20,0,20,0.75);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #photoModal.show { display:flex; animation:fadeInModal 0.3s ease; }
  @keyframes fadeInModal { from{opacity:0;} to{opacity:1;} }
  #photoModalInner {
    max-width:88vw; max-height:78vh;
    transform:scale(0.7); opacity:0;
    animation:zoomIn 0.35s ease forwards;
    border-radius:16px; overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
  }
  @keyframes zoomIn { to { transform:scale(1); opacity:1; } }
  #photoModalInner img { max-width:88vw; max-height:78vh; display:block; }
  #closePhotoModal {
    position:absolute; top:26px; right:22px;
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.4);
    color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  /* ============ PAGE 4: TEDDIES ============ */
  #teddyRow {
    display:flex; justify-content:center; gap:28px;
    margin-top:60px; width:100%;
  }
  .teddy {
    position:relative;
    font-size:64px;
    opacity:0;
    transform:translateY(120px) scale(0.5);
    cursor:pointer;
    filter:drop-shadow(0 0 10px rgba(255,150,200,0.5));
  }
  .teddy .giftMini {
    position:absolute;
    bottom:2px;
    right:-8px;
    font-size:24px;
    filter:drop-shadow(0 0 6px rgba(255,150,200,0.6));
  }
  .teddy.enter1 { animation:teddyIn 0.7s ease forwards, teddyBounce 1.6s ease-in-out 0.7s infinite; }
  .teddy.enter2 { animation:teddyIn 0.7s ease forwards, teddyBounce 1.6s ease-in-out 0.9s infinite; }
  .teddy.enter3 { animation:teddyIn 0.7s ease forwards, teddyBounce 1.6s ease-in-out 1.1s infinite; }
  @keyframes teddyIn {
    0% { opacity:0; transform:translateY(120px) scale(0.5); }
    70% { opacity:1; transform:translateY(-10px) scale(1.1); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes teddyBounce {
    0%,100% { transform:translateY(0) scale(1); }
    50% { transform:translateY(-10px) scale(1.03); }
  }
  #teddyHint {
    margin-top:20px; font-size:13px; opacity:0.85; text-align:center;
  }

  #teddyModal {
    position:fixed; inset:0; z-index:60;
    display:none; align-items:center; justify-content:center;
    background:rgba(20,0,20,0.75);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:20px;
  }
  #teddyModal.show { display:flex; }
  #teddyModalCard {
    background:rgba(255,255,255,0.14);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:22px;
    padding:26px 22px;
    max-width:400px;
    width:100%;
    text-align:center;
    transform:scale(0.6); opacity:0;
    animation:zoomIn 0.35s ease forwards;
  }
  #teddyModalCard .teddyEmoji { font-size:44px; margin-bottom:10px; }
  #teddyModalText { font-size:16px; line-height:1.7; margin-bottom:20px; }

  /* ============ SCROLLBAR HIDE ============ */
  .page::-webkit-scrollbar { display:none; }
  .page { scrollbar-width:none; }

  /* ============ RESPONSIVE ============ */
  @media (min-width:600px) {
    #giftBox { font-size:96px; }
    #cakeEmoji { font-size:110px; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- Floating hearts, sits behind all pages -->
  <div id="heartsLayer"></div>
  <!-- Confetti / fireworks layer, sits above all pages -->
  <div id="fxLayer"></div>

  <!-- Music toggle -->
  <div id="musicToggle" onclick="toggleMusic()">🔊</div>
  <!--
    Replace the src below with your own royalty-free birthday/romantic track.
    Keep the file in the same folder as this HTML file, e.g. "music.mp3".
  -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- ============ PAGE 1 ============ -->
  <section id="page1" class="page active">
    <div id="titleWrap"></div>
    <div id="dearText">❤️ Dear Navya ❤️</div>

    <div id="giftStage">
      <div id="giftBox" onclick="openGift()">🎁</div>
      <div id="giftHint">Tap the gift box</div>

      <div id="cakeStage">
        <div id="countdownNum"></div>
        <div id="cakeWrap">
          <div id="candles"></div>
          <div id="cakeEmoji">🎂</div>
        </div>
        <div id="wishText">🎉 Make A Wish 🎉</div>
        <button class="btn" id="songBtn" style="display:none; margin-top:14px;" onclick="playBirthdaySong()">🎤 Sing for Navya</button>
        <button class="btn" id="nextSurpriseBtn" onclick="goToPage(2)">➡️ Next Surprise</button>
      </div>
    </div>
  </section>

  <!-- ============ PAGE 2 ============ -->
  <section id="page2" class="page">
    <div class="glass">
      <div id="msgHeading">❤️ Navya Meri Jaan ❤️</div>
      <div id="typedMsg"></div>
    </div>
    <div class="navRow">
      <button class="btn" onclick="goToPage(1)">⬅️ Back</button>
      <button class="btn" onclick="goToPage(3)">➡️ Next</button>
    </div>
  </section>

  <!-- ============ PAGE 3 ============ -->
  <section id="page3" class="page">
    <div id="galleryGrid"></div>
    <div class="navRow">
      <button class="btn" onclick="goToPage(2)">⬅️ Back</button>
      <button class="btn" onclick="goToPage(4)">➡️ Next</button>
    </div>
  </section>

  <!-- ============ PAGE 4 ============ -->
  <section id="page4" class="page">
    <div class="glass" style="text-align:center;">
      <div style="font-size:20px; font-weight:800;">Tap a teddy for a surprise 🧸</div>
    </div>
    <div id="teddyRow"></div>
    <div id="teddyHint">Each one is hiding something sweet ❤️</div>
    <div class="navRow" style="max-width:220px; justify-content:center;">
      <button class="btn" onclick="goToPage(3)">⬅️ Back</button>
    </div>
  </section>

  <!-- Photo fullscreen modal -->
  <div id="photoModal" onclick="closePhotoModalOnBg(event)">
    <div id="closePhotoModal" onclick="closePhotoModal()">✕</div>
    <div id="photoModalInner"><img id="photoModalImg" src="" alt="Memory"></div>
  </div>

  <!-- Teddy message modal -->
  <div id="teddyModal">
    <div id="teddyModalCard">
      <div class="teddyEmoji" id="teddyModalEmoji">🧸</div>
      <div id="teddyModalText"></div>
      <button class="btn btn-black" onclick="closeTeddyModal()">⬅️ Back</button>
    </div>
  </div>

</div>

<script>
/* ==========================================================
   GLOBAL: floating hearts, ambient background animation
   ========================================================== */
const heartsLayer = document.getElementById('heartsLayer');
function spawnFloatingHeart() {
  const heart = document.createElement('div');
  heart.className = 'floatHeart';
  heart.textContent = ['❤️','💗','💖','💕'][Math.floor(Math.random()*4)];
  const left = Math.random()*100;
  const duration = 6 + Math.random()*6;
  const drift = (Math.random()*80 - 40) + 'px';
  heart.style.left = left + 'vw';
  heart.style.fontSize = (14 + Math.random()*16) + 'px';
  heart.style.setProperty('--drift', drift);
  heart.style.animationDuration = duration + 's';
  heartsLayer.appendChild(heart);
  setTimeout(() => heart.remove(), duration*1000 + 200);
}
setInterval(spawnFloatingHeart, 550);
for (let i=0;i<6;i++) setTimeout(spawnFloatingHeart, i*300);

/* ==========================================================
   MUSIC TOGGLE
   ========================================================== */
const bgMusic = document.getElementById('bgMusic');
let musicOn = false;
let musicStarted = false;
function toggleMusic() {
  const btn = document.getElementById('musicToggle');
  if (!musicOn) {
    bgMusic.play().catch(()=>{ /* file not present yet, ignore */ });
    musicOn = true;
    btn.textContent = '🔊';
  } else {
    bgMusic.pause();
    musicOn = false;
    btn.textContent = '🔇';
  }
}
// try to start music quietly on first tap anywhere (mobile autoplay policies)
document.addEventListener('click', function firstTap() {
  if (!musicStarted) {
    musicStarted = true;
    bgMusic.play().then(()=>{ musicOn = true; }).catch(()=>{});
  }
}, { once:true });

/* ==========================================================
   PAGE NAVIGATION
   ========================================================== */
let currentPage = 1;
function goToPage(n) {
  const cur = document.getElementById('page'+currentPage);
  const next = document.getElementById('page'+n);
  cur.classList.add('leaving');
  cur.classList.remove('active');
  setTimeout(() => {
    cur.classList.remove('leaving');
    next.classList.add('active');
    currentPage = n;
    if (n === 2) startTyping();
    if (n === 3) buildGallery();
    if (n === 4) startTeddies();
  }, 260);
}

/* ==========================================================
   PAGE 1: LETTER ANIMATION
   ========================================================== */
const titleText = "🎂 HAPPY BIRTHDAY 🎂";
const titleWrap = document.getElementById('titleWrap');
[...titleText].forEach((ch, i) => {
  const span = document.createElement('span');
  span.textContent = ch === ' ' ? '\u00A0' : ch;
  span.style.animationDelay = (0.15 * i) + 's';
  titleWrap.appendChild(span);
});
// add continuous glow once all letters have landed
setTimeout(() => {
  titleWrap.querySelectorAll('span').forEach(s => s.classList.add('glowPulse'));
}, titleText.length * 150 + 700);

/* ==========================================================
   PAGE 1: GIFT BOX -> CAKE -> COUNTDOWN -> WISH -> CONFETTI
   ========================================================== */
let giftOpened = false;
function openGift() {
  if (giftOpened) return;
  giftOpened = true;
  const box = document.getElementById('giftBox');
  const hint = document.getElementById('giftHint');
  box.classList.add('opened');
  hint.style.display = 'none';

  setTimeout(() => {
    document.getElementById('cakeStage').style.display = 'flex';
    buildCandles();
    runCountdown();
  }, 450);
}

function buildCandles() {
  const wrap = document.getElementById('candles');
  wrap.innerHTML = '';
  for (let i=0;i<3;i++) {
    const c = document.createElement('div');
    c.className = 'candle';
    c.innerHTML = '<span class="flameEmoji">🕯️</span><span class="smoke">💨</span>';
    wrap.appendChild(c);
  }
}

function runCountdown() {
  const numEl = document.getElementById('countdownNum');
  let count = 3;
  numEl.textContent = count;
  const interval = setInterval(() => {
    count--;
    if (count > 0) {
      numEl.textContent = '';
      void numEl.offsetWidth; // restart animation
      numEl.textContent = count;
    } else {
      clearInterval(interval);
      numEl.textContent = '';
      setTimeout(blowCandles, 300);
    }
  }, 1000);
}

function blowCandles() {
  document.querySelectorAll('.flameEmoji').forEach(f => f.classList.add('blown'));
  document.querySelectorAll('.smoke').forEach(s => s.classList.add('active'));
  spawnConfetti(60);
  spawnFireworks();
  setTimeout(() => {
    const wish = document.getElementById('wishText');
    wish.classList.add('show');
  }, 500);
  setTimeout(() => {
    document.getElementById('nextSurpriseBtn').style.display = 'inline-block';
    document.getElementById('songBtn').style.display = 'inline-block';
  }, 1400);
}

/* ==========================================================
   IN-BROWSER "SING" FOR NAVYA (uses the device's built-in
   text-to-speech voice — no external audio file needed).
   Lyrics used here are the traditional "Happy Birthday to
   You" words, which are public domain.
   ========================================================== */
function playBirthdaySong() {
  if (!('speechSynthesis' in window)) {
    alert('Text-to-speech is not supported on this device/browser.');
    return;
  }
  speechSynthesis.cancel();
  const lines = [
    "Happy birthday to you.",
    "Happy birthday to you.",
    "Happy birthday dear Navya.",
    "Happy birthday to you!"
  ];
  let voices = speechSynthesis.getVoices();
  function speakLines() {
    lines.forEach((line, idx) => {
      const utter = new SpeechSynthesisUtterance(line);
      utter.rate = 0.85;
      utter.pitch = 1.25;
      if (voices.length) utter.voice = voices[0];
      speechSynthesis.speak(utter);
    });
  }
  if (!voices.length) {
    speechSynthesis.onvoiceschanged = () => {
      voices = speechSynthesis.getVoices();
      speakLines();
    };
  } else {
    speakLines();
  }
}

/* ==========================================================
   CONFETTI + FIREWORKS
   ========================================================== */
const fxLayer = document.getElementById('fxLayer');
const confettiColors = ['#ff5da2','#a259e6','#ffd166','#ff9ad6','#c084fc','#ffffff'];

function spawnConfetti(count) {
  for (let i=0;i<count;i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random()*100) + 'vw';
    c.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    c.style.animationDuration = (2.2 + Math.random()*2) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    fxLayer.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

function spawnFireworks() {
  const bursts = 4;
  for (let b=0; b<bursts; b++) {
    setTimeout(() => {
      const cx = 15 + Math.random()*70; // vw
      const cy = 15 + Math.random()*35; // vh
      const particles = 22;
      for (let i=0;i<particles;i++) {
        const p = document.createElement('div');
        p.className = 'fwParticle';
        const angle = (Math.PI*2*i)/particles;
        const dist = 60 + Math.random()*50;
        p.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle)*dist + 'px');
        p.style.left = cx + 'vw';
        p.style.top = cy + 'vh';
        p.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
        p.style.animationDuration = '1s';
        fxLayer.appendChild(p);
        setTimeout(() => p.remove(), 1100);
      }
    }, b * 350);
  }
}

// If a listed photo file is missing/not found, this shows a pretty
// pink placeholder instead of a broken image icon.
function fallbackPlaceholder() {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>
    <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='%23ff8fc7'/><stop offset='1' stop-color='%23a259e6'/>
    </linearGradient></defs>
    <rect width='300' height='300' fill='url(%23g)'/>
    <text x='50%' y='50%' font-size='60' text-anchor='middle' dominant-baseline='middle'>💗</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + svg.replace(/\n\s*/g,'');
}

let galleryBuilt = false;
function buildGallery() {
  if (galleryBuilt) return;
  galleryBuilt = true;
  const grid = document.getElementById('galleryGrid');
  placeholderPhotos.forEach((src, idx) => {
    const card = document.createElement('div');
    card.className = 'photoCard';
    card.style.animationDelay = (idx * 0.1) + 's';
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Memory ' + (idx+1);
    img.onerror = function() { this.onerror = null; this.src = fallbackPlaceholder(); };
    card.appendChild(img);
    card.onclick = () => openPhotoModal(img.src);
    grid.appendChild(card);
  });
}
function openPhotoModal(src) {
  document.getElementById('photoModalImg').src = src;
  const modal = document.getElementById('photoModal');
  const inner = document.getElementById('photoModalInner');
  inner.style.animation = 'none';
  void inner.offsetWidth;
  inner.style.animation = '';
  modal.classList.add('show');
}
function closePhotoModal() {
  document.getElementById('photoModal').classList.remove('show');
}
function closePhotoModalOnBg(e) {
  if (e.target.id === 'photoModal') closePhotoModal();
}

/* ==========================================================
   PAGE 4: TEDDY BEARS
   ========================================================== */
const teddyMessages = [
  "Tumhari smile duniya ki sabse pyari cheez hai. Har roz tumhe khush dekhna hi meri sabse badi khwahish hai. Happy Birthday, meri jaan! 🧸❤️",
  "Jitni bhi baatein main tumse karta hoon, utni hi aur karne ka mann karta hai. Tum meri zindagi ka sabse sundar hissa ho. 🧸💕",
  "Aaj, kal aur hamesha... main tumhare saath hoon. Yeh saal tumhare liye khushiyon se bhara ho. I love you, Navya. 🧸💖"
];
let teddiesStarted = false;
function startTeddies() {
  if (teddiesStarted) return;
  teddiesStarted = true;
  const row = document.getElementById('teddyRow');
  for (let i=0;i<3;i++) {
    const t = document.createElement('div');
    t.className = 'teddy';
    t.innerHTML = '🧸<span class="giftMini">🎁</span>';
    t.onclick = () => openTeddyModal(i);
    row.appendChild(t);
    setTimeout(() => { t.classList.add('enter' + (i+1)); }, i * 500);
  }
}
function openTeddyModal(idx) {
  document.getElementById('teddyModalText').textContent = teddyMessages[idx];
  const modal = document.getElementById('teddyModal');
  const card = document.getElementById('teddyModalCard');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
  modal.classList.add('show');
}
function closeTeddyModal() {
  document.getElementById('teddyModal').classList.remove('show');
}
